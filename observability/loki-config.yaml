# Loki single-node configuration for C05 Synthetic Microservices Lab (ADR-S02)
# Enforces bounded 7-day retention and low-cardinality label indexing.

auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1

limits_config:
  retention_period: 168h
  max_query_lookback: 24h
  max_entries_limit_per_query: 200
  allow_structured_metadata: true

